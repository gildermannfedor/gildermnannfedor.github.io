# Template for a separate Pages repository containing ONLY the reviewed export.
# Place reviewed public/ contents at repository root. No server checkout is uploaded.
name: Publish ERRATIS wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public files
        shell: bash
        run: |
          mkdir _site
          cp -- *.html search.json .nojekyll _site/
          mkdir _site/assets
          cp -- assets/wiki.css assets/wiki.js assets/mark.svg _site/assets/
          mkdir _site/assets/items
          cp -- assets/items/*.png _site/assets/items/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
